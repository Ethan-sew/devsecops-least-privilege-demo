name: Security Policy Engine Gate

# 'workflow_dispatch' adds a magic "Run Workflow" button to the UI so you can demo it anytime!
on: [push, workflow_dispatch] 

jobs:
  test-insecure-infrastructure:
    name: Test Insecure Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Security Gate on Insecure Code
        run: python policy_engine.py insecure_policy.json

  test-secure-infrastructure:
    name: Test Secure Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Security Gate on Secure Code
        run: python policy_engine.py secure_policy.json
