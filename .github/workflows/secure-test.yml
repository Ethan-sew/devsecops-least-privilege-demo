name: 2 - Test Secure Code & Deploy (Manual)

# Again, ONLY runs manually when you click it.
on: workflow_dispatch

jobs:
  run-secure-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Security Gate on Secure Code (Will Pass)
        run: python policy_engine.py secure_policy.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Secure Infrastructure to AWS
        run: |
          echo "Security Gate Passed! Deploying to AWS..."
          aws s3 mb s3://devsecops-bucket-demo-SoftwareSecurityDEMO  # Remember to make this name unique!
