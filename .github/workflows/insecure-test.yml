name: 1 - Test Insecure Code (Manual)

# 'workflow_dispatch' means it ONLY runs when you click the button. 
# There is no 'push' trigger here.
on: workflow_dispatch 

jobs:
  run-insecure-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Security Gate on Insecure Code (Will Fail)
        run: python policy_engine.py insecure_policy.json
